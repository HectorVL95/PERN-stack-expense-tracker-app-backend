services:
  # Your Node.js Backend Service
  backend:
    build: . # Builds the image using the Dockerfile in the current directory
    env_file:
      - .env
    ports:
      - "5050:5050" # Maps host port 5000 to container port 5000
    environment:
      # This is the key! Use the service name 'db' as the host
      - DB_HOST=${DB_HOST}
      - DB_USER=${PGUSER}
      - DB_PASSWORD=${PGPASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
    depends_on:
      - db # Ensures the database service starts first

  # Your PostgreSQL Database Service
  db:
    image: postgres:14 # Use the official PostgreSQL image
    ports:
      - "5432:5432" # Maps host port 5432 to container port 5432 (optional, for external tools)
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data # Persist database data
      
volumes:
  pgdata: # Defines the volume for persistent data storage